name: Relais LinkedIn vers Telegram

on:
  schedule:
    - cron: '15 */3 * * *'   # Décalé de 15 min par rapport à l'autre workflow
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  relay-linkedin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # R est déjà installé sur l'image ubuntu-24.04 de GitHub : pas besoin
      # de setup-r ni d'apt-get, qui dépendent des miroirs Ubuntu (ils ont
      # bloqué les exécutions le 2026-11-11). Version d'Ubuntu figée pour que
      # les packages binaires en cache restent compatibles.
      - name: Préparer R
        run: |
          echo "R_LIBS_USER=$HOME/R-library" >> "$GITHUB_ENV"
          echo "R_VER=$(Rscript -e 'cat(as.character(getRversion()))')" >> "$GITHUB_ENV"
          echo "RUNNER_IMAGE=$ImageOS" >> "$GITHUB_ENV"
          Rscript --version

      - name: Cache packages R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-linkedin-${{ env.RUNNER_IMAGE }}-R${{ env.R_VER }}-${{ hashFiles('linkedin_relay.R', '.github/scripts/install_r_packages.R') }}

      - name: Installer les packages R
        run: Rscript .github/scripts/install_r_packages.R mRpostman httr stringr xml2 rvest jsonlite dplyr base64enc

      - name: Lancer le relais LinkedIn
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: Rscript linkedin_relay.R

      - name: Sauvegarder la mémoire des emails relayés
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data/seen_linkedin_emails.json data/seen_linkedin_job_urls.json
          git diff --quiet --cached || git commit -m "Mise à jour des emails LinkedIn relayés [skip ci]"
          # L'autre workflow peut avoir poussé entre-temps
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
