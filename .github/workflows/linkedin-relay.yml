name: Relais LinkedIn vers Telegram

on:
  # EN PAUSE : Gmail refuse la connexion (« Login denied »), le mot de passe
  # d'application GMAIL_APP_PASSWORD n'est plus valide. Pour réactiver :
  # 1) créer un nouveau mot de passe sur https://myaccount.google.com/apppasswords
  # 2) le mettre dans Settings → Secrets and variables → Actions → GMAIL_APP_PASSWORD
  # 3) lancer ce workflow à la main (onglet Actions → Run workflow) pour vérifier
  # 4) retirer le « # » devant les deux lignes ci-dessous
  # schedule:
  #   - cron: '15 */3 * * *'   # Décalé de 15 min par rapport à l'autre workflow
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  relay-linkedin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}   # active l'environnement R de micromamba
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # R et ses packages viennent de conda-forge (micromamba) : binaires
      # précompilés qui embarquent leurs propres bibliothèques (libxml2, ICU...).
      # Plus de compilation, plus d'apt-get ni de setup-r, donc plus de panne
      # quand GitHub change d'image Ubuntu ou que ses miroirs Ubuntu rament.
      - name: Installer R et les packages
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: r
          create-args: >-
            r-base=4.4
            r-httr
            r-stringr
            r-xml2
            r-rvest
            r-jsonlite
            r-dplyr
            r-base64enc
            r-curl
            r-assertthat
            r-magrittr
            zlib
          condarc: |
            channels:
              - conda-forge
          cache-environment: true
          init-shell: bash

      # (zlib fournit les en-têtes C nécessaires pour compiler mRpostman)
      # mRpostman n'existe pas sur conda-forge : installé depuis le CRAN
      # (compilé sur place, ses dépendances sont déjà dans l'environnement)
      - name: Installer mRpostman et vérifier les packages
        run: |
          Rscript -e 'if (!requireNamespace("mRpostman", quietly = TRUE)) install.packages("mRpostman", repos = "https://cloud.r-project.org")'
          Rscript -e 'for (p in c("mRpostman","httr","stringr","xml2","rvest","jsonlite","dplyr","base64enc")) suppressPackageStartupMessages(library(p, character.only = TRUE)); cat("Packages R OK\n")'

      - name: Lancer le relais LinkedIn
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: Rscript linkedin_relay.R

      - name: Sauvegarder la mémoire des emails relayés
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data/seen_linkedin_emails.json data/seen_linkedin_job_urls.json
          git diff --quiet --cached || git commit -m "Mise à jour des emails LinkedIn relayés [skip ci]"
          # L'autre workflow peut avoir poussé entre-temps
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
