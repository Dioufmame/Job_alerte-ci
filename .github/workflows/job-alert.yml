name: Alerte offres data CI

on:
  schedule:
    # Toutes les 3 heures
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour que le workflow puisse committer seen_urls.json

jobs:
  scrape-and-notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # R est déjà installé sur l'image ubuntu-24.04 de GitHub : pas besoin
      # de setup-r ni d'apt-get, qui dépendent des miroirs Ubuntu (ils ont
      # bloqué les exécutions le 2026-11-11). Version d'Ubuntu figée pour que
      # les packages binaires en cache restent compatibles.
      - name: Préparer R
        run: |
          echo "R_LIBS_USER=$HOME/R-library" >> "$GITHUB_ENV"
          echo "R_VER=$(Rscript -e 'cat(as.character(getRversion()))')" >> "$GITHUB_ENV"
          echo "RUNNER_IMAGE=$ImageOS" >> "$GITHUB_ENV"
          Rscript --version

      - name: Cache packages R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ env.RUNNER_IMAGE }}-R${{ env.R_VER }}-${{ hashFiles('scrape_jobs.R', '.github/scripts/install_r_packages.R') }}

      - name: Installer les packages R
        run: Rscript .github/scripts/install_r_packages.R rvest httr jsonlite stringr dplyr xml2

      - name: Lancer le scraping et les alertes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optionnel : ajoute un secret MATCH_THRESHOLD pour ajuster la
          # sélectivité (3 par défaut si non défini, voir README.md)
          MATCH_THRESHOLD: ${{ secrets.MATCH_THRESHOLD }}
        run: Rscript scrape_jobs.R

      - name: Sauvegarder la mémoire des offres vues
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data/seen_urls.json
          git diff --quiet --cached || git commit -m "Mise à jour des offres vues [skip ci]"
          # L'autre workflow peut avoir poussé entre-temps
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
