name: Alerte offres data CI

on:
  schedule:
    # Toutes les 3 heures
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour que le workflow puisse committer seen_urls.json

jobs:
  scrape-and-notify:
    # Version d'Ubuntu figée : quand ubuntu-latest change de version, les
    # packages R compilés en cache ne trouvent plus leurs bibliothèques système.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Identifier l'image du runner
        run: echo "RUNNER_IMAGE=$ImageOS" >> "$GITHUB_ENV"

      - name: Cache packages R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          # Le cache dépend de l'image et de la version de R, pour ne jamais
          # recharger des packages compilés pour un autre système.
          key: r-pkgs-${{ env.RUNNER_IMAGE }}-R4.4.0-${{ hashFiles('scrape_jobs.R') }}

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Installer les packages R
        run: |
          Rscript -e 'install.packages(c("rvest","httr","jsonlite","stringr","dplyr"), repos="https://cloud.r-project.org")'

      - name: Lancer le scraping et les alertes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optionnel : ajoute un secret MATCH_THRESHOLD pour ajuster la
          # sélectivité (3 par défaut si non défini, voir README.md)
          MATCH_THRESHOLD: ${{ secrets.MATCH_THRESHOLD }}
        run: Rscript scrape_jobs.R

      - name: Sauvegarder la mémoire des offres vues
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data/seen_urls.json
          git diff --quiet --cached || git commit -m "Mise à jour des offres vues [skip ci]"
          git push
