name: Alerte offres data CI

on:
  schedule:
    # Toutes les 3 heures
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour que le workflow puisse committer seen_urls.json

jobs:
  scrape-and-notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}   # active l'environnement R de micromamba
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # R et ses packages viennent de conda-forge (micromamba) : binaires
      # précompilés qui embarquent leurs propres bibliothèques (libxml2, ICU...).
      # Plus de compilation, plus d'apt-get ni de setup-r, donc plus de panne
      # quand GitHub change d'image Ubuntu ou que ses miroirs Ubuntu rament.
      - name: Installer R et les packages
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: r
          create-args: >-
            r-base=4.4
            r-rvest
            r-xml2
            r-httr
            r-jsonlite
            r-stringr
            r-dplyr
          condarc: |
            channels:
              - conda-forge
          cache-environment: true
          init-shell: bash

      - name: Vérifier que les packages se chargent
        run: Rscript -e 'for (p in c("rvest","xml2","httr","jsonlite","stringr","dplyr")) suppressPackageStartupMessages(library(p, character.only = TRUE)); cat("Packages R OK\n")'

      - name: Lancer le scraping et les alertes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optionnel : ajoute un secret MATCH_THRESHOLD pour ajuster la
          # sélectivité (3 par défaut si non défini, voir README.md)
          MATCH_THRESHOLD: ${{ secrets.MATCH_THRESHOLD }}
        run: Rscript scrape_jobs.R

      - name: Sauvegarder la mémoire des offres vues
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data/seen_urls.json
          git diff --quiet --cached || git commit -m "Mise à jour des offres vues [skip ci]"
          # L'autre workflow peut avoir poussé entre-temps
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
